name: DÜRTÜ — oyun motoru testleri

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sözdizimi kontrolü (index.html içi <script>)
        run: |
          node -e "
            const fs=require('fs');
            const html=fs.readFileSync('durtu/index.html','utf8');
            const m=html.match(/<script>([\s\S]*?)<\/script>/);
            if(!m) throw new Error('script yok');
            fs.writeFileSync('/tmp/app.js', m[1]);
          "
          node --check /tmp/app.js
      - name: Oyun motoru regresyon testleri
        run: node tests/engine.test.js
